# Runs when a tag vX.Y.Z is pushed (the monorepo's sdk-mirror workflow pushes it for a monorepo
# tag sdk-swift-vX.Y.Z). For SwiftPM the tag is the release (it accepts the "v" prefix); this
# checks the tag against Honk.version, runs the tests and creates the GitHub release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        name: The tag, Honk.version and CHANGELOG.md agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          actual="$(sed -nE 's/^ *public static let version = "([^"]+)"/\1/p' Sources/HonkMe/Honk.swift)"
          [ "$actual" = "$v" ] || { echo "::error::Honk.swift has version = \"$actual\" but the tag is $GITHUB_REF_NAME"; exit 1; }
          grep -qF "## [$v]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: [verify, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GitHub release with the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          # shellcheck disable=SC2016 # the backticks are a literal Markdown code fence
          printf '\n```swift\n.package(url: "%s/%s.git", from: "%s"),\n```\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION" >> notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
